# LightDM greeter background. Source of truth for the file installed at
#   /etc/lightdm/lightdm-gtk-greeter.conf.d/50-background.conf
#
# Install (needs root; /etc is outside this repo):
#   sudo install -Dm644 ~/Dotfiles/assets/spirograph-dark.png \
#        /usr/share/backgrounds/spirograph-dark.png
#   sudo install -Dm644 ~/Dotfiles/lightdm-gtk-greeter-background.conf \
#        /etc/lightdm/lightdm-gtk-greeter.conf.d/50-background.conf
#
# The image lives under /usr/share/backgrounds rather than ~/Dotfiles because the
# greeter runs as user `lightdm`, which cannot traverse $HOME (mode 0700). For the
# same reason this file must be a real copy, not a symlink into ~/Dotfiles.
#
# No scaling prefix means SCALING_MODE_ZOOMED: aspect-preserving fill with a
# centre crop, matching the `swaylock -s fill` in swayconfig. Do not add
# `#stretched:` -- it would distort the circular spirograph into an ellipse.
#
# Uninstall: sudo rm /etc/lightdm/lightdm-gtk-greeter.conf.d/50-background.conf

[greeter]
background=/usr/share/backgrounds/spirograph-dark.png
user-background=false
