[user]
email = "mucinoab@gmail.com"
name = "Bruno A. Muciño"

[diff]
tool = "delta"

[ui]
default-command = ["log", "--limit",  "5"]
# Git-format diff (what `delta` expects), routed through a wrapper so that
# ~/.config/jj/attributes applies: `*.pdf -diff` keeps PDFs from being diffed
# as text in show / diff / log -p. jj has no native equivalent yet --
# https://github.com/jj-vcs/jj/issues/53 (.gitattributes),
# https://github.com/jj-vcs/jj/issues/2915 and
# https://github.com/jj-vcs/jj/issues/4548 (hide a file's diff).
# Escape hatch: `jj diff --git` uses the builtin formatter and shows the raw diff.
diff-formatter = ["/home/bmucino/.config/jj/diff-formatter.sh", "$left", "$right"]
pager=["delta", "--pager", "less -FRX"] # Keeps output from the terminal after closing the pager
merge-editor = "meld"

[snapshot]
auto-update-stale = true

# These options allow for `jj diff` and `jj show` to clear the output from the terminal after closing the pager.
[[--scope]]
--when.commands = ["diff", "show"]

[--scope.ui]
pager = "delta"

[git]
write-change-id-header = true

[remotes.origin]
auto-track-bookmarks = "*"

[aliases]
s = ["status"]
e = ["edit"]
d = ["diff"]
gf = ["git", "fetch"]
gp = ["git", "push"]
n = ["new"]
w = ["workspace"]
